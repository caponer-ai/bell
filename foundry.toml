[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.33"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com/"
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com/"
